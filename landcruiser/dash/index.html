<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e12">
<title>CYBER CRUISER — Dashboard di bordo</title>
<link rel="stylesheet" href="css/dash.css">
</head>
<body>
<div id="app">
  <!-- barra di stato superiore -->
  <header id="topbar">
    <div class="brand">CYBER<span>CRUISER</span></div>
    <div id="topStats" class="top-stats"></div>
    <div class="top-right">
      <span id="srcBadge" class="badge badge-sim">SIM</span>
      <span id="clock" class="clock">--:--</span>
    </div>
  </header>

  <!-- barra di navigazione laterale -->
  <nav id="nav"></nav>

  <!-- area schermate -->
  <main id="screen"></main>

  <!-- riga di allarmi -->
  <footer id="alerts" class="alerts"></footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
